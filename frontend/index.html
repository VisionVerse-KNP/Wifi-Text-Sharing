<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="YuEDYmZhJI47pfXa63ZRh5yOCMYSgciAV_rUEcBMusg" />

    <!-- Font: Inter, loaded properly (was referenced in CSS but never actually linked before) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#4463f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TextShare" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Route-specific SEO (title, description, keywords, canonical, OG, Twitter)
      is now owned entirely by the <SEO> component (src/components/SEO.tsx,
      via react-helmet-async) so it can be unique per page. Nothing route-level
      is duplicated here — Helmet doesn't know to clean up static tags it
      didn't create, so keeping both here and in <SEO> would leave duplicate
      meta tags in the live DOM. This generic title is just a pre-hydration
      fallback for the brief moment before React mounts.
    -->
    <title>WiFi Text & File Share</title>
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Favicons / PWA icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance: warm up connection to the AdSense origin before it's requested -->
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />

    <!-- Structured data: WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "WiFi Text Share",
        "url": "https://localwifishare.netlify.app/",
        "applicationCategory": "CommunicationApplication",
        "operatingSystem": "Any (Web-based)",
        "description": "Share text and files instantly with everyone on your WiFi network, or create a password-protected private room to share messages and files in real time.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "WiFi Text Share",
        "url": "https://localwifishare.netlify.app/",
        "logo": "https://localwifishare.netlify.app/icons/icon-512.svg"
      }
    </script>

    <!--
      FAQPage and BreadcrumbList structured data are injected dynamically per-route
      by the <SEO> component (src/components/SEO.tsx, via react-helmet-async) so
      they only appear on pages where that content is actually visible/relevant —
      required by Google's structured data guidelines and better for real SEO
      value than one static site-wide block.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; text-align: center; padding: 3rem 1.5rem; max-width: 480px; margin: 0 auto;">
        <h1 style="font-size: 1.25rem; margin-bottom: 0.5rem;">JavaScript required</h1>
        <p style="color: #64748b; font-size: 0.95rem;">
          WiFi Text &amp; File Share needs JavaScript enabled to work — it's a real-time app that syncs
          messages and files live. Please enable JavaScript in your browser settings and reload the page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8100874496888896"
     crossorigin="anonymous"></script>
  </body>
</html>
