<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#4463f7" />

    <!-- Primary SEO -->
    <title>WiFi Text Share — Instant Real-Time Text Sharing Over WiFi & Private Rooms</title>
    <meta
      name="description"
      content="Share text instantly with everyone on your WiFi — no login, no accounts. Or create a password-protected private room and share text and messages in real time from anywhere."
    />
    <meta
      name="keywords"
      content="wifi text share, share text over wifi, local network text sharing, real-time text share, private room text sharing, no login text sharing, LAN chat, instant messaging without account"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="WiFi Text Share" />
    <link rel="canonical" href="https://wifitextshare.example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WiFi Text Share" />
    <meta property="og:title" content="WiFi Text Share — Instant Real-Time Text Sharing" />
    <meta
      property="og:description"
      content="Share text instantly with everyone on your WiFi, or create a password-protected private room. No login required."
    />
    <meta property="og:url" content="https://wifitextshare.example.com/" />
    <meta property="og:image" content="https://wifitextshare.example.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WiFi Text Share — Instant Real-Time Text Sharing" />
    <meta
      name="twitter:description"
      content="Share text instantly with everyone on your WiFi, or create a password-protected private room. No login required."
    />
    <meta name="twitter:image" content="https://wifitextshare.example.com/og-image.png" />

    <!-- Favicons / PWA icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance: warm up connection to the AdSense origin before it's requested -->
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />


    <!-- Structured data: WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "WiFi Text Share",
        "url": "https://wifitextshare.example.com/",
        "applicationCategory": "CommunicationApplication",
        "operatingSystem": "Any (Web-based)",
        "description": "Share text instantly with everyone on your WiFi network, or create a password-protected private room to share text and messages in real time.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "WiFi Text Share",
        "url": "https://wifitextshare.example.com/",
        "logo": "https://wifitextshare.example.com/icons/icon-512.svg"
      }
    </script>

    <!--
      FAQPage and BreadcrumbList structured data are injected dynamically per-route
      by useSEO() (see src/hooks/useSEO.ts) so they only appear on pages where that
      content is actually visible/relevant — required by Google's structured data
      guidelines and better for real SEO value than one static site-wide block.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8100874496888896"
     crossorigin="anonymous"></script>
  </body>
</html>
